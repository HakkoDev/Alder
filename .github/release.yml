changelog:
  exclude:
    labels:
      - skip-changelog
      - internal
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: New features
      labels: [feature, enhancement]
    - title: Bug fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Maintenance and dependencies
      labels: [dependencies, maintenance]
    - title: Other changes
      labels: ['*']
